name: validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check agent files
        run: |
          for f in .opencode/agents/*.md; do
            [ -f "$f" ] && echo "✅ $f" || echo "❌ $f"
          done
      - name: Check site files
        run: |
          for f in site/*.html; do
            [ -f "$f" ] && echo "✅ $f" || echo "❌ $f"
          done
      - name: Check config exists
        run: |
          [ -f opencode.json ] && echo "✅ opencode.json" || echo "❌ opencode.json"
          [ -f AGENTS.md ] && echo "✅ AGENTS.md" || echo "❌ AGENTS.md"
      - name: Check m3j-workflow skill
        run: |
          [ -f .agents/skills/m3j-workflow/SKILL.md ] && echo "✅ .agents/skills/m3j-workflow/SKILL.md" || echo "❌ .agents/skills/m3j-workflow/SKILL.md"
          for f in .agents/skills/m3j-workflow/templates/*.md; do
            [ -f "$f" ] && echo "✅ $f" || echo "❌ $f"
          done
